<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolted Skateboards</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    header {
      background: #1c1c1c;
      padding: 30px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .tagline {
      color: #aaa;
      margin-top: 8px;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      margin: 15px auto;
      padding: 18px;
      border-radius: 12px;
      max-width: 420px;
      border: 1px solid #2a2a2a;
    }

    .price {
      color: #00e676;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      background: #1c1c1c;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔩 BOLTED</h1>
    <div class="tagline">Custom Skateboard Builds & Assembly</div>
  </header>

  <div class="container">

    <div class="card">
      <h2>Basic Build</h2>
      <p>We assemble your skateboard parts</p>
      <div class="price">$10 - $20</div>
    </div>

    <div class="card">
      <h2>Custom Build</h2>
      <p>Assembly + setup + tuning</p>
      <div class="price">$20 - $35</div>
    </div>

    <div class="card">
      <h2>Pay with PayPal</h2>
      <p>Secure checkout</p>

      <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
        <input type="hidden" name="cmd" value="_xclick">
        <input type="hidden" name="business" value="YOUR_PAYPAL_EMAIL_HERE">
        <input type="hidden" name="item_name" value="Bolted Skateboard Build Service">
        <input type="hidden" name="currency_code" value="USD">
        <input type="hidden" name="amount" value="20">

        <button type="submit">Pay Now</button>
      </form>
    </div>

  </div>

  <footer>
    © 2026 Bolted Skateboards
  </footer>

</body>
</html>
